<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNN 逐步展开</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  .wrap { overflow-x:auto; }
  svg { display:block; }
  .sl { display:grid; grid-template-columns:9em 1fr 3em; gap:6px; align-items:center; font-size:13px; }
  .eq { font-size:13.5px; line-height:1.9; }
  .lg span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 3px 0 10px; vertical-align:middle; }
</style>
</head>
<body>
<h1>RNN 逐步展开：一边读，一边更新“记忆”</h1>
<div class="sub">每读一个词，RNN 用同一套参数算一次 h<sub>t</sub> = tanh(W·x<sub>t</sub> + u·h<sub>t−1</sub>)。为了看得清，这里的隐藏状态只有 3 维：<span class="lg"><span style="background:#e53935"></span>情感<span style="background:#1e88e5"></span>在说配送<span style="background:#8e24aa"></span>语气强度</span>。</div>

<div class="row"><input type="text" id="txt" value="送餐 很 快" aria-label="用空格分好词的句子"></div>
<div class="row ex" id="ex"></div>
<div class="sl"><span>记忆系数 u</span><input type="range" id="u" min="0.1" max="1.2" step="0.05" value="0.5"><b id="uv"></b></div>
<div class="row"><button class="main" id="step">读下一个词 ▶</button><button id="all">一口气读完</button><button id="reset">从头读</button></div>

<div class="wrap"><svg id="chain" height="210"></svg></div>
<div class="box eq" id="eq"></div>
<div class="box">
  <h2>梯度消失：开头的词对结果还有多大影响？</h2>
  <div class="wrap"><svg id="grad" height="120"></svg></div>
  <div class="eq" id="geq"></div>
</div>

<script>
(function () {
  // 手工设定的 3 维“词向量”：[情感, 配送, 强度]；没有列出的词当作中性词 [0,0,0]
  var E = { "送餐":[0,1,0], "配送":[0,1,0], "外卖":[0,0.6,0], "快":[0.8,0.3,0], "慢":[-0.8,0.3,0], "准时":[0.6,0.5,0],
            "好吃":[1,0,0], "难吃":[-1,0,0], "咸":[-0.6,0,0], "用心":[0.6,0,0], "不错":[0.7,0,0], "差":[-0.8,0,0],
            "很":[0,0,1], "太":[0,0,1], "非常":[0,0,1], "实在":[0,0,0.8] };
  var EX = ["送餐 很 快", "难吃 包装 一般 价格 一般 分量 一般 位置 一般 环境 一般", "包装 很 用心 配送 也 准时 但是 这次 菜 实在 太 咸 了"];
  var COL = ["#e53935", "#1e88e5", "#8e24aa"], Wx = 1.5, toks, H, t;
  function vec(w) { return E[w] || [0, 0, 0]; }
  function run() {
    var u = +document.getElementById("u").value; H = [[0, 0, 0]];
    toks.forEach(function (w, i) { var x = vec(w), h = H[i]; H.push([0, 1, 2].map(function (d) { return Math.tanh(Wx * x[d] + u * h[d]); })); });
  }
  function load() { toks = document.getElementById("txt").value.trim().split(/\s+/).filter(Boolean); t = 0; run(); draw(); }
  function bars(h, x0, y0, scale) {
    return h.map(function (v, d) { var hgt = Math.abs(v) * scale; return '<rect x="' + (x0 + d * 12) + '" y="' + (v >= 0 ? y0 - hgt : y0) + '" width="10" height="' + Math.max(hgt, 0.5) + '" fill="' + COL[d] + '"/>'; }).join("") +
      '<line x1="' + (x0 - 2) + '" y1="' + y0 + '" x2="' + (x0 + 36) + '" y2="' + y0 + '" stroke="#90a4ae"/>';
  }
  function sig(z) { return 1 / (1 + Math.exp(-z)); }
  function draw() {
    var u = +document.getElementById("u").value; document.getElementById("uv").textContent = u.toFixed(2);
    var n = toks.length, cw = 78, W = Math.max(560, (n + 1) * cw + 110), s = "";
    s += '<text x="8" y="16" font-size="11" fill="#78909c">h₀</text>' + bars(H[0], 8, 110, 36);
    toks.forEach(function (w, i) {
      var x = 60 + i * cw, done = i < t, cur = i === t - 1;
      s += '<rect x="' + x + '" y="62" width="' + (cw - 22) + '" height="90" rx="8" fill="' + (cur ? "#e8eaf6" : "#fff") + '" stroke="' + (done ? "#3f51b5" : "#cfd8dc") + '" stroke-width="' + (cur ? 2 : 1) + '"/>';
      s += '<text x="' + (x + (cw - 22) / 2) + '" y="182" font-size="14" text-anchor="middle" fill="' + (done ? "#263238" : "#b0bec5") + '">' + w + "</text>";
      s += '<line x1="' + (x + (cw - 22) / 2) + '" y1="168" x2="' + (x + (cw - 22) / 2) + '" y2="154" stroke="#90a4ae" marker-end="url(#a)"/>';
      s += '<line x1="' + (x - 20) + '" y1="107" x2="' + (x - 1) + '" y2="107" stroke="' + (done ? "#3f51b5" : "#cfd8dc") + '" marker-end="url(#a)"/>';
      s += '<text x="' + (x + 4) + '" y="76" font-size="10" fill="#78909c">RNN</text>';
      if (done) s += bars(H[i + 1], x + 12, 112, 36) + '<text x="' + (x + 4) + '" y="146" font-size="10" fill="#3f51b5">h' + (i + 1) + "</text>";
    });
    if (t === n && n) {
      var p = sig(4 * H[n][0]), x2 = 60 + n * cw;
      s += '<line x1="' + (x2 - 20) + '" y1="107" x2="' + (x2 - 1) + '" y2="107" stroke="#3f51b5" marker-end="url(#a)"/><rect x="' + x2 + '" y="78" width="96" height="58" rx="8" fill="' + (p > 0.5 ? "#e8f5e9" : "#ffebee") + '" stroke="#90a4ae"/>' +
        '<text x="' + (x2 + 48) + '" y="100" font-size="12" text-anchor="middle">分类层</text><text x="' + (x2 + 48) + '" y="122" font-size="13" text-anchor="middle" font-weight="bold" fill="' + (p > 0.5 ? "#2e7d32" : "#c62828") + '">' + (Math.abs(p - 0.5) < 0.05 ? "说不准" : p > 0.5 ? "正面" : "负面") + " " + (p * 100).toFixed(0) + "%</text>";
    }
    s += '<text x="60" y="30" font-size="12" fill="#78909c">每个方框都是同一个 RNN（同一套 W、u），只是在不同时刻被重复使用</text>';
    var svg = document.getElementById("chain"); svg.setAttribute("width", W);
    svg.innerHTML = '<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#90a4ae"/></marker></defs>' + s;
    var f = function (v) { return (v >= 0 ? " " : "") + v.toFixed(2); };
    document.getElementById("eq").innerHTML = t === 0 ? "h₀ 初始为 [0, 0, 0]。点“读下一个词”开始。" :
      "第 " + t + " 步读入“<b>" + toks[t - 1] + "</b>”，x = [" + vec(toks[t - 1]).join(", ") + "]" + (E[toks[t - 1]] ? "" : "（中性词）") +
      "<br>h" + t + " = tanh(" + Wx + " × x + " + u.toFixed(2) + " × h" + (t - 1) + ") = [" + H[t].map(f).join(", ") + "]" +
      "<br>情感这一维 = tanh(" + Wx + "×" + vec(toks[t - 1])[0] + " + " + u.toFixed(2) + "×" + H[t - 1][0].toFixed(2) + ") = <b>" + H[t][0].toFixed(2) + "</b>";
    // 梯度：∂h_T/∂h_1 在“情感”维上 = Π u·(1 − h_t²)
    var g = [1], G = document.getElementById("grad"), gs = "", gw = Math.max(560, n * 46 + 60);
    for (var k = n; k > 1; k--) g.unshift(g[0] * u * (1 - H[k][0] * H[k][0]));
    G.setAttribute("width", gw);
    toks.forEach(function (w, i) {
      var v = g[i], lg = Math.max(0, 1 + Math.log10(Math.max(v, 1e-12)) / 12), x = 30 + i * 46, h = lg * 70;
      gs += '<rect x="' + x + '" y="' + (80 - h) + '" width="30" height="' + Math.max(h, 1) + '" fill="' + (v > 0.1 ? "#3f51b5" : v > 0.001 ? "#7986cb" : "#c5cae9") + '"/>' +
        '<text x="' + (x + 15) + '" y="96" font-size="11" text-anchor="middle">' + w + '</text><text x="' + (x + 15) + '" y="112" font-size="9.5" text-anchor="middle" fill="#78909c">' + (v >= 0.01 ? v.toFixed(2) : v.toExponential(0)) + "</text>";
    });
    G.innerHTML = gs;
    document.getElementById("geq").innerHTML = "柱子表示每个词对最后结果的影响（梯度，取对数画出）。从最后一个词往回传，每过一步都要乘上 u × tanh 的导数（≤ u）。" +
      (n > 1 ? "第 1 个词“" + toks[0] + "”只剩 <b>" + (g[0] >= 0.01 ? g[0].toFixed(3) : g[0].toExponential(1)) + "</b>。" : "") +
      (u < 0.8 ? "试试把 u 调大，或者读第二个例句，看开头的“难吃”是怎样被“忘掉”的。" : u > 1 ? "u 大于 1 时，tanh 很快饱和；在真实网络里，大于 1 的系数连乘会让梯度爆炸。" : "u 接近 1 时记得更久，这正是 LSTM 用“门”想做到的事（8.5 节）。");
    document.getElementById("step").disabled = t >= n;
  }
  document.getElementById("ex").innerHTML = "<span class='lbl'>试试：</span>" + EX.map(function (e, i) { return "<button data-i='" + i + "'>" + ["送餐很快", "难吃 + 一长串中性词", "前面夸、最后差评"][i] + "</button>"; }).join("");
  document.querySelectorAll("#ex button").forEach(function (b) { b.onclick = function () { document.getElementById("txt").value = EX[+b.dataset.i]; load(); }; });
  document.getElementById("step").onclick = function () { if (t < toks.length) t++; draw(); };
  document.getElementById("all").onclick = function () { t = toks.length; draw(); };
  document.getElementById("reset").onclick = function () { t = 0; draw(); };
  document.getElementById("u").oninput = function () { run(); draw(); };
  document.getElementById("txt").onchange = load;
  load();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
