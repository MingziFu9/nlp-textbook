<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词向量与余弦相似度</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
  svg { width:100%; max-width:420px; display:block; margin:0 auto; touch-action:none; background:#fafafa; border-radius:8px; }
  .handle { cursor:grab; }
  .wd { cursor:pointer; }
  .calc { font-size:13.5px; line-height:1.9; }
  .near div { font-size:13.5px; }
</style>
</head>
<body>
<h1>词向量与余弦相似度：看“方向”，不看“长短”</h1>
<div class="sub">真实的词向量有 100~300 维，这里画成二维方便观察。左边拖动两支箭头的端点，看余弦相似度怎样变化；右边点一个词，找出和它最相近的词。</div>

<div class="grid2">
  <div class="box">
    <h2>① 两个向量的夹角</h2>
    <svg id="vec" viewBox="-120 -120 240 240"></svg>
    <div class="row ex"><span class="lbl">试试：</span><button id="p1">方向相同、长短不同</button><button id="p2">互相垂直</button><button id="p3">方向相反</button></div>
    <div class="calc" id="calc"></div>
  </div>
  <div class="box">
    <h2>② 词语地图（示意坐标）</h2>
    <svg id="map" viewBox="-120 -120 240 240"></svg>
    <div class="row ex"><span class="lbl">玩法：</span><button id="mNear" class="on">找近义词</button><button id="mAna">类比：国王 − 男人 + 女人</button><button id="mOdd">找不合群：香蕉 苹果 橙子 键盘</button></div>
    <div class="near" id="near"></div>
  </div>
</div>
<div class="note">右图的坐标是为了演示编出来的，聚成四团的方式参照了实验 5-2 用网购评论训练的结果。余弦相似度只看两支箭头（从原点出发）之间的夹角。</div>

<script>
(function () {
  // ① 可拖动的两个向量
  var A = [80, -20], B = [40, -70], drag = null, svg = document.getElementById("vec");
  function pt(e, el) { var r = el.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) / r.width * 240 - 120, (t.clientY - r.top) / r.height * 240 - 120]; }
  function arrow(v, c, name) {
    return '<line x1="0" y1="0" x2="' + v[0] + '" y2="' + v[1] + '" stroke="' + c + '" stroke-width="3" marker-end="url(#m' + name + ')"/>' +
      '<circle class="handle" data-n="' + name + '" cx="' + v[0] + '" cy="' + v[1] + '" r="9" fill="' + c + '" fill-opacity=".25"/>' +
      '<text x="' + (v[0] + 8) + '" y="' + (v[1] - 8) + '" font-size="13" fill="' + c + '" font-weight="bold">' + name + "</text>";
  }
  function drawVec() {
    var dot = A[0] * B[0] + A[1] * B[1], la = Math.hypot(A[0], A[1]), lb = Math.hypot(B[0], B[1]), cos = dot / (la * lb || 1), deg = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
    var a1 = Math.atan2(A[1], A[0]), a2 = Math.atan2(B[1], B[0]), r = 26, sweep = ((a2 - a1 + 3 * Math.PI) % (2 * Math.PI)) - Math.PI > 0 ? 1 : 0;
    svg.innerHTML = '<defs><marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#3f51b5"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#e53935"/></marker></defs>' +
      '<line x1="-115" y1="0" x2="115" y2="0" stroke="#cfd8dc"/><line x1="0" y1="-115" x2="0" y2="115" stroke="#cfd8dc"/>' +
      '<path d="M' + r * Math.cos(a1) + "," + r * Math.sin(a1) + " A" + r + "," + r + " 0 0," + sweep + " " + r * Math.cos(a2) + "," + r * Math.sin(a2) + '" fill="none" stroke="#ef6c00" stroke-width="2"/>' +
      arrow(A, "#3f51b5", "A") + arrow(B, "#e53935", "B");
    // 坐标按“向上为正”显示
    var a = [A[0] / 20, -A[1] / 20], b = [B[0] / 20, -B[1] / 20], f = function (x) { return (Math.round(x * 10) / 10).toFixed(1); };
    var d2 = a[0] * b[0] + a[1] * b[1], n1 = Math.hypot(a[0], a[1]), n2 = Math.hypot(b[0], b[1]);
    document.getElementById("calc").innerHTML = "A = [" + f(a[0]) + ", " + f(a[1]) + "]，B = [" + f(b[0]) + ", " + f(b[1]) + "]<br>点积 A·B = " + f(d2) + "；|A| = " + f(n1) + "，|B| = " + f(n2) +
      "<br>cos θ = " + f(d2) + " ÷ (" + f(n1) + " × " + f(n2) + ") = <b class='big'>" + cos.toFixed(2) + "</b>　夹角约 " + Math.round(deg) + "°<br>" +
      (cos > 0.9 ? "方向几乎一致：非常相似。" : cos > 0.3 ? "方向大致相同：有点相似。" : cos > -0.3 ? "接近垂直：基本不相关。" : "方向相反。");
  }
  function start(e) { var t = e.target; if (t.classList && t.classList.contains("handle")) { drag = t.dataset.n; e.preventDefault(); } }
  function move(e) { if (!drag) return; var p = pt(e, svg); p = [Math.max(-110, Math.min(110, p[0])), Math.max(-110, Math.min(110, p[1]))]; if (Math.hypot(p[0], p[1]) < 8) return; if (drag === "A") A = p; else B = p; drawVec(); e.preventDefault(); }
  svg.addEventListener("mousedown", start); svg.addEventListener("touchstart", start, { passive:false });
  window.addEventListener("mousemove", move); window.addEventListener("touchmove", move, { passive:false });
  window.addEventListener("mouseup", function () { drag = null; }); window.addEventListener("touchend", function () { drag = null; });
  document.getElementById("p1").onclick = function () { A = [30, -30]; B = [90, -90]; drawVec(); };
  document.getElementById("p2").onclick = function () { A = [80, 0]; B = [0, -80]; drawVec(); };
  document.getElementById("p3").onclick = function () { A = [70, -40]; B = [-70, 40]; drawVec(); };
  drawVec();

  // ② 词语地图：[词, x, y, 类别]（y 向上为正）
  var C = { e:"#3f51b5", f:"#43a047", h:"#8e24aa", p:"#ef6c00", r:"#795548" };
  var W = [["手机",88,22,"e"],["电脑",80,40,"e"],["电池",95,8,"e"],["屏幕",72,30,"e"],["键盘",70,48,"e"],
           ["香蕉",-30,92,"f"],["橙子",-12,96,"f"],["榴莲",-40,82,"f"],["苹果",5,85,"f"],
           ["酒店",-92,-12,"h"],["房间",-85,-28,"h"],["前台",-98,4,"h"],["服务",-75,-38,"h"],
           ["好吃",-10,-80,"p"],["新鲜",-25,-72,"p"],["甜",-18,-92,"p"],["不错",5,-75,"p"],
           ["男人",40,-55,"r"],["女人",60,-38,"r"],["国王",55,-80,"r"],["女王",75,-63,"r"]];
  var mode = "near", sel = "手机";
  function vec(w) { var x = W.filter(function (r) { return r[0] === w; })[0]; return [x[1], x[2]]; }
  function cos(a, b) { return (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1])); }
  function nearest(v, skip) { return W.filter(function (r) { return skip.indexOf(r[0]) < 0; }).map(function (r) { return { w:r[0], c:cos(v, [r[1], r[2]]) }; }).sort(function (a, b) { return b.c - a.c; }); }
  function drawMap() {
    var s = '<line x1="-115" y1="0" x2="115" y2="0" stroke="#eceff1"/><line x1="0" y1="-115" x2="0" y2="115" stroke="#eceff1"/>', out = "", hl = [];
    if (mode === "near") {
      var v = vec(sel), n = nearest(v, [sel]).slice(0, 3); hl = [sel].concat(n.map(function (x) { return x.w; }));
      s += '<line x1="0" y1="0" x2="' + v[0] + '" y2="' + (-v[1]) + '" stroke="#263238" stroke-width="1.5"/>';
      out = "和“<b>" + sel + "</b>”余弦相似度最高的词：" + n.map(function (x) { return "<div>" + x.w + "　" + x.c.toFixed(3) + "</div>"; }).join("") + "<div class='note'>点地图上的任意一个词试试。“苹果”离电子产品也不远，想想为什么（提示：5.6.5 节一词多义）。</div>";
    } else if (mode === "ana") {
      var k = vec("国王"), m = vec("男人"), w = vec("女人"), r = [k[0] - m[0] + w[0], k[1] - m[1] + w[1]], nn = nearest(r, ["国王", "男人", "女人"]);
      hl = ["国王", "男人", "女人", nn[0].w];
      s += '<line x1="' + m[0] + '" y1="' + (-m[1]) + '" x2="' + k[0] + '" y2="' + (-k[1]) + '" stroke="#795548" stroke-dasharray="4 3"/><line x1="' + w[0] + '" y1="' + (-w[1]) + '" x2="' + r[0] + '" y2="' + (-r[1]) + '" stroke="#795548" stroke-dasharray="4 3"/>';
      s += '<circle cx="' + r[0] + '" cy="' + (-r[1]) + '" r="10" fill="none" stroke="#e53935" stroke-width="2"/>';
      out = "国王 − 男人 + 女人 = [" + r[0] + ", " + r[1] + "]（红圈），离它最近的词是 <b>" + nn[0].w + "</b>（余弦 " + nn[0].c.toFixed(3) + "）。<div class='note'>两条虚线平行且等长：“男人→国王”和“女人→女王”是同一种变化。</div>";
    } else {
      var g = ["香蕉", "苹果", "橙子", "键盘"], avg = [0, 0];
      g.forEach(function (x) { var v2 = vec(x); avg[0] += v2[0] / 4; avg[1] += v2[1] / 4; });
      var sc = g.map(function (x) { return { w:x, c:cos(vec(x), avg) }; }).sort(function (a, b) { return a.c - b.c; }); hl = g;
      out = "先求四个词的平均方向，再看每个词和它的余弦相似度：" + sc.map(function (x, i) { return "<div>" + (i === 0 ? "<b class='bad'>" + x.w + "</b>" : x.w) + "　" + x.c.toFixed(3) + "</div>"; }).join("") + "<div class='note'>最低的“" + sc[0].w + "”就是不合群的词。</div>";
    }
    W.forEach(function (r) {
      var on = hl.indexOf(r[0]) >= 0;
      s += '<g class="wd" data-w="' + r[0] + '"><circle cx="' + r[1] + '" cy="' + (-r[2]) + '" r="' + (on ? 4.5 : 3) + '" fill="' + C[r[3]] + '"/><text x="' + (r[1] + 5) + '" y="' + (-r[2] + 4) + '" font-size="' + (on ? 12 : 10) + '" fill="' + C[r[3]] + '" font-weight="' + (on ? "bold" : "normal") + '" opacity="' + (hl.length && !on ? 0.5 : 1) + '">' + r[0] + "</text></g>";
    });
    var map = document.getElementById("map"); map.innerHTML = s;
    map.querySelectorAll(".wd").forEach(function (g) { g.onclick = function () { sel = g.dataset.w; setMode("near"); }; });
    document.getElementById("near").innerHTML = out;
  }
  function setMode(m) { mode = m; ["mNear", "mAna", "mOdd"].forEach(function (id) { document.getElementById(id).classList.toggle("on", id === { near:"mNear", ana:"mAna", odd:"mOdd" }[m]); }); drawMap(); }
  document.getElementById("mNear").onclick = function () { setMode("near"); };
  document.getElementById("mAna").onclick = function () { setMode("ana"); };
  document.getElementById("mOdd").onclick = function () { setMode("odd"); };
  drawMap();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
