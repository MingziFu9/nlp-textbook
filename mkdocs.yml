site_name: 自然语言处理导论
site_description: 面向成人教育人工智能技术应用专业专科学生的 NLP 入门教材，每章配套动手实验
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 自然语言处理概述": chapters/01-intro/index.md
  - "第 2 章 文本预处理": chapters/02-preprocessing/index.md
  - "第 3 章 词法分析：分词、词性与大模型分词器": chapters/03-lexical/index.md
  - "第 4 章 句法分析与语义分析": chapters/04-syntax/index.md
  - "第 5 章 文本表示：从词袋到文本嵌入": chapters/05-representation/index.md
  - "第 6 章 文本分类与情感分析": chapters/06-classification/index.md
  - "第 7 章 命名实体识别与信息抽取": chapters/07-ner/index.md
  - "第 8 章 深度学习基础：神经网络、RNN 与 LSTM": chapters/08-deep-learning/index.md
  - "第 9 章 Transformer 与预训练大模型": chapters/09-transformer/index.md
  - "第 10 章 机器翻译与文本生成": chapters/10-generation/index.md
  - "第 11 章 问答系统、RAG 与智能体": chapters/11-qa-rag-agent/index.md
  - "第 12 章 NLP 的伦理、安全与法律": chapters/12-ethics/index.md
  - 交互动画:
    - sims/index.md
    - "NLP 发展时间线": sims/nlp-timeline/index.md
    - "文本清洗流水线": sims/cleaning-pipeline/index.md
    - "最大匹配分词": sims/max-match/index.md
    - "BPE 合并过程": sims/bpe-merge/index.md
    - "依存句法树": sims/dependency-parser/index.md
    - "TF-IDF 计算器": sims/tfidf-calculator/index.md
    - "词向量与余弦相似度": sims/word-vectors/index.md
    - "阈值与混淆矩阵": sims/threshold-confusion/index.md
    - "情感词典打分演示": sims/lexicon-scorer/index.md
    - "BIO 标注练习": sims/bio-tagging/index.md
    - "神经元与激活函数": sims/neuron-activation/index.md
    - "RNN 逐步展开": sims/rnn-unroll/index.md
    - "自注意力热力图": sims/self-attention/index.md
    - "BLEU 计算器": sims/bleu-calculator/index.md
    - "贪心与束搜索": sims/beam-search/index.md
    - "温度与 Top-p 采样": sims/temperature-sampling/index.md
    - "RAG 切块实验": sims/rag-chunking/index.md
    - "ReAct 执行回放": sims/react-replay/index.md
    - "脱敏与提示注入攻防": sims/privacy-injection/index.md
  - 学习图谱: learning-graph/index.md
  - 附录:
    - "附录 A Python 速查": appendix/a-python.md
    - "附录 B NLP 工具库接口速查": appendix/b-libraries.md
    - "附录 C 实验环境、模型与数据说明": appendix/c-environment.md
    - "附录 D 国产大模型 API 申请与使用指南": appendix/d-llm-api.md
    - "附录 E 术语表": appendix/e-glossary.md
